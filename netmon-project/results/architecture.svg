<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Barlow, DejaVu Sans, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4f5d6b"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #4f5d6b; stroke-width: 1.5; }
      .key { fill: #e6effa; stroke: #2a78d6; stroke-width: 2; }
      .t { font-size: 19px; font-weight: 600; fill: #14202d; }
      .s { font-size: 15px; fill: #4f5d6b; }
      .zone { font-size: 21px; font-weight: 600; fill: #14202d; }
      .zs { font-size: 15px; fill: #4f5d6b; }
      .ln { stroke: #4f5d6b; stroke-width: 2; fill: none; marker-end: url(#a); }
      .dl { stroke: #4f5d6b; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fcfcfb"/>
  <text x="40" y="52" font-size="30" font-weight="600" fill="#14202d">NetMon system architecture</text>
  <text x="40" y="82" class="s">Data flows left to right. Solid arrows: processing path. Dashed arrows: reads and writes to cloud services.</text>

  <!-- zone: sources -->
  <rect x="30" y="120" width="250" height="740" rx="10" fill="#f3f6f8" stroke="#d6dde4"/>
  <text x="50" y="155" class="zone">Data sources</text>
  <rect class="box" x="50" y="190" width="210" height="110" rx="8"/>
  <text x="65" y="222" class="t">CIC-IDS2017 flows</text>
  <text x="65" y="248" class="s">Labelled CSV files,</text><text x="65" y="268" class="s">CICFlowMeter format</text>
  <rect class="box" x="50" y="330" width="210" height="130" rx="8"/>
  <text x="65" y="362" class="t">Live capture</text>
  <text x="65" y="388" class="s">scripts/capture.py</text><text x="65" y="408" class="s">(Scapy) on the lab</text><text x="65" y="428" class="s">network → flow CSV</text>
  <rect class="box" x="50" y="490" width="210" height="110" rx="8"/>
  <text x="65" y="522" class="t">Threat-intel list</text>
  <text x="65" y="548" class="s">data/blacklist.csv</text><text x="65" y="568" class="s">(bad IP addresses)</text>
  <rect class="box" x="50" y="630" width="210" height="130" rx="8"/>
  <text x="65" y="662" class="t">Benign baseline</text>
  <text x="65" y="688" class="s">Learned once from</text><text x="65" y="708" class="s">normal traffic (Monday)</text><text x="65" y="728" class="s">+ Isolation Forest</text>

  <!-- zone: app -->
  <rect x="320" y="120" width="880" height="740" rx="10" fill="#f3f6f8" stroke="#2a78d6" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="340" y="155" class="zone">NetMon web app (Flask) on Render</text>
  <text x="340" y="178" class="zs">Free web service, deployed from GitHub with render.yaml</text>

  <rect class="box" x="345" y="210" width="190" height="110" rx="8"/>
  <text x="360" y="242" class="t">Ingestion</text>
  <text x="360" y="268" class="s">Upload page,</text><text x="360" y="288" class="s">schema check</text>

  <rect class="box" x="565" y="210" width="190" height="110" rx="8"/>
  <text x="580" y="242" class="t">Preprocessing</text>
  <text x="580" y="268" class="s">Pandas: clean, fix</text><text x="580" y="288" class="s">timestamps, map ports</text>

  <rect class="box" x="785" y="210" width="190" height="110" rx="8"/>
  <text x="800" y="242" class="t">Features</text>
  <text x="800" y="268" class="s">Per-flow fields and</text><text x="800" y="288" class="s">1-minute windows</text>

  <rect class="key" x="345" y="370" width="630" height="190" rx="10"/>
  <text x="365" y="404" class="t">Detection engine</text>
  <text x="365" y="428" class="s">Thresholds from config.yaml and the Settings page</text>
  <rect class="box" x="365" y="445" width="190" height="95" rx="6"/>
  <text x="378" y="474" class="t">Rules R1–R4</text>
  <text x="378" y="498" class="s">port scan, brute force,</text><text x="378" y="518" class="s">traffic spike, blacklist</text>
  <rect class="box" x="575" y="445" width="180" height="95" rx="6"/>
  <text x="588" y="474" class="t">Statistics R5–R6</text>
  <text x="588" y="498" class="s">z-score and IQR</text><text x="588" y="518" class="s">on flow size</text>
  <rect class="box" x="775" y="445" width="180" height="95" rx="6"/>
  <text x="788" y="474" class="t">Isolation Forest</text>
  <text x="788" y="498" class="s">optional, trained</text><text x="788" y="518" class="s">on benign flows</text>

  <rect class="box" x="345" y="610" width="300" height="110" rx="8"/>
  <text x="360" y="642" class="t">Alert manager</text>
  <text x="360" y="668" class="s">Merge minutes into incidents, assign</text><text x="360" y="688" class="s">severity, suggest firewall action</text>

  <rect class="box" x="675" y="610" width="300" height="110" rx="8"/>
  <text x="690" y="642" class="t">Report generator</text>
  <text x="690" y="668" class="s">PDF summary and CSV of</text><text x="690" y="688" class="s">all alerts (ReportLab)</text>

  <rect class="box" x="1010" y="370" width="170" height="350" rx="8"/>
  <text x="1025" y="402" class="t">Web dashboard</text>
  <text x="1025" y="430" class="s">Overview charts</text>
  <text x="1025" y="455" class="s">Alerts table</text>
  <text x="1025" y="480" class="s">IP drill-down</text>
  <text x="1025" y="505" class="s">Reports</text>
  <text x="1025" y="530" class="s">Evaluation</text>
  <text x="1025" y="555" class="s">Settings</text>
  <text x="1025" y="590" class="s">Plotly.js charts,</text><text x="1025" y="610" class="s">login required</text>

  <!-- zone: cloud -->
  <rect x="1240" y="120" width="330" height="460" rx="10" fill="#f3f6f8" stroke="#1baf7a" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1260" y="155" class="zone">Supabase (cloud)</text>
  <rect class="box" x="1265" y="190" width="280" height="160" rx="8"/>
  <text x="1280" y="222" class="t">PostgreSQL database</text>
  <text x="1280" y="250" class="s">uploads, alerts, reports,</text><text x="1280" y="270" class="s">settings (SQLAlchemy)</text>
  <text x="1280" y="300" class="s">Local runs use SQLite</text>
  <rect class="box" x="1265" y="380" width="280" height="170" rx="8"/>
  <text x="1280" y="412" class="t">Storage bucket</text>
  <text x="1280" y="440" class="s">raw/ uploaded files</text>
  <text x="1280" y="462" class="s">processed/ Parquet flows</text>
  <text x="1280" y="484" class="s">reports/ PDF and CSV</text>
  <text x="1280" y="514" class="s">Signed download links</text>

  <rect x="1240" y="620" width="330" height="240" rx="10" fill="#f3f6f8" stroke="#d6dde4"/>
  <text x="1260" y="655" class="zone">Users</text>
  <rect class="box" x="1265" y="690" width="280" height="130" rx="8"/>
  <text x="1280" y="722" class="t">Network administrator</text>
  <text x="1280" y="748" class="s">Browser on laptop or phone:</text><text x="1280" y="768" class="s">views alerts, downloads</text><text x="1280" y="788" class="s">reports, tunes thresholds</text>

  <!-- arrows: sources to ingestion -->
  <path class="ln" d="M260 245 H300 V265 H343"/>
  <path class="ln" d="M260 395 H300 V265"/>
  <path class="ln" d="M260 545 H310 V470 H363"/>
  <path class="ln" d="M260 695 H315 V530 H363"/>
  <!-- pipeline -->
  <path class="ln" d="M535 265 H563"/>
  <path class="ln" d="M755 265 H783"/>
  <path class="ln" d="M880 320 V368"/>
  <path class="ln" d="M495 560 V608"/>
  <path class="ln" d="M645 665 H673"/>
  <path class="ln" d="M975 665 H1008"/>
  <path class="ln" d="M975 465 H1008"/>
  <!-- cloud -->
  <path class="dl" d="M440 210 V195 H1100 V270 H1263"/>
  <path class="dl" d="M495 720 V780 H1210 V300 H1263"/>
  <path class="dl" d="M825 720 V800 H1225 V465 H1263"/>
  <path class="dl" d="M1405 552 V688"/>
  <path class="dl" d="M1263 755 H1182"/>
</svg>
